<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loan Agreement | Jitume Leo</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .agreement-page {

            min-height:
                calc(100vh - 78px);

            background:
                #f5f7fa;

            padding:
                40px 20px;

        }


        .agreement-wrapper {

            max-width:
                950px;

            margin:
                auto;

        }


        .agreement-actions-top {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

            margin-bottom:
                25px;

        }


        .agreement-actions-top button {

            border:
                none;

            padding:
                12px 18px;

            border-radius:
                7px;

            cursor:
                pointer;

            font-weight:
                700;

        }


        .back-btn {

            background:
                white;

            border:
                1px solid #d8dee6 !important;

            color:
                #273142;

        }


        .download-btn {

            background:
                #168a63;

            color:
                white;

        }


        .upload-btn {

            background:
                #273142;

            color:
                white;

        }


        .agreement-paper {

            background:
                white;

            padding:
                55px;

            border-radius:
                8px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.08);

        }


        .agreement-header {

            text-align:
                center;

            border-bottom:
                2px solid #168a63;

            padding-bottom:
                25px;

            margin-bottom:
                30px;

        }


        .agreement-header h1 {

            font-size:
                30px;

            margin-bottom:
                7px;

        }


        .agreement-header h2 {

            font-size:
                18px;

            color:
                #168a63;

            margin-bottom:
                10px;

        }


        .agreement-header p {

            color:
                #697586;

            font-size:
                13px;

        }


        .agreement-section {

            margin-top:
                28px;

        }


        .agreement-section h3 {

            font-size:
                17px;

            margin-bottom:
                12px;

            color:
                #1f2937;

        }


        .details-table {

            width:
                100%;

            border-collapse:
                collapse;

        }


        .details-table td {

            border:
                1px solid #e2e7ec;

            padding:
                12px;

            font-size:
                13px;

        }


        .details-table td:first-child {

            width:
                40%;

            font-weight:
                700;

            background:
                #f8fafc;

        }


        .terms-list {

            padding-left:
                20px;

        }


        .terms-list li {

            margin-bottom:
                10px;

            line-height:
                1.7;

            font-size:
                13px;

            color:
                #4b5563;

        }


        .signature-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                25px;

            margin-top:
                30px;

        }


        .signature-box {

            border:
                1px solid #dfe4ea;

            min-height:
                130px;

            padding:
                15px;

            border-radius:
                6px;

        }


        .signature-box h4 {

            margin-bottom:
                45px;

        }


        .signature-line {

            border-top:
                1px solid #475467;

            margin-bottom:
                8px;

        }


        .signature-box p {

            margin:
                4px 0;

            font-size:
                12px;

            color:
                #667085;

        }


        .prototype-note {

            margin-top:
                30px;

            padding:
                15px;

            border-radius:
                7px;

            background:
                #fff8e5;

            border:
                1px solid #efdca0;

            font-size:
                12px;

            line-height:
                1.6;

            color:
                #6b5b1b;

        }


        .next-step-box {

            margin-top:
                30px;

            padding:
                20px;

            border-radius:
                10px;

            background:
                #eef8f3;

            border:
                1px solid #cdebdc;

            text-align:
                center;

        }


        .next-step-box h3 {

            margin-bottom:
                8px;

        }


        .next-step-box p {

            font-size:
                13px;

            color:
                #596575;

            margin-bottom:
                15px;

            line-height:
                1.6;

        }


        .continue-upload-btn {

            background:
                #168a63;

            color:
                white;

            border:
                none;

            padding:
                13px 22px;

            border-radius:
                7px;

            font-weight:
                700;

            cursor:
                pointer;

        }


        .continue-upload-btn:hover {

            background:
                #106c4d;

        }


        .loading {

            text-align:
                center;

            padding:
                60px;

            color:
                #667085;

        }


        .error-state {

            text-align:
                center;

            padding:
                60px 30px;

            color:
                #a61b1b;

        }


        @media print {

            .navbar,
            .agreement-actions-top,
            .next-step-box {

                display:
                    none !important;

            }


            .agreement-page {

                background:
                    white;

                padding:
                    0;

            }


            .agreement-wrapper {

                max-width:
                    none;

            }


            .agreement-paper {

                box-shadow:
                    none;

                padding:
                    20px;

            }

        }


        @media (max-width: 700px) {

            .agreement-paper {

                padding:
                    25px;

            }


            .signature-grid {

                grid-template-columns:
                    1fr;

            }


            .agreement-actions-top {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="logo">

        JITUME <span>LEO</span>

    </div>


    <nav>

        <a href="client.html">
            Dashboard
        </a>

    </nav>

</header>



<main class="agreement-page">

    <div class="agreement-wrapper">


        <div class="agreement-actions-top">


            <button
                type="button"
                class="back-btn"
                id="backButton">

                ← Back to Dashboard

            </button>


            <button
                type="button"
                class="download-btn"
                id="downloadButton">

                Download / Print Agreement

            </button>

        </div>



        <div
            id="agreementContainer"
            class="agreement-paper">

            <div class="loading">

                Loading loan agreement...

            </div>

        </div>

    </div>

</main>



<script type="module">

import {

    getAuth,

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {

    getFirestore,

    doc,

    getDoc

}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {
    app
}
from
"./firebase.js";


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const agreementContainer =
    document.getElementById(
        "agreementContainer"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


/*
|--------------------------------------------------------------------------
| GET APPLICATION ID FROM URL
|--------------------------------------------------------------------------
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const applicationId =
    urlParams.get(
        "applicationId"
    );


let currentApplication =
    null;


/*
|--------------------------------------------------------------------------
| AUTHENTICATION
|--------------------------------------------------------------------------
*/

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        if (!applicationId) {

            showError(
                "Application ID is missing. Please return to your client dashboard and open your application again."
            );

            return;

        }


        await loadApplication(
            user
        );

    }
);


/*
|--------------------------------------------------------------------------
| LOAD EXACT APPLICATION
|--------------------------------------------------------------------------
*/

async function loadApplication(
    user
) {

    try {

        const applicationReference =
            doc(
                db,
                "loanApplications",
                applicationId
            );


        const applicationSnapshot =
            await getDoc(
                applicationReference
            );


        if (
            !applicationSnapshot.exists()
        ) {

            showError(
                "The requested loan application could not be found."
            );

            return;

        }


        const application =
            applicationSnapshot.data();


        /*
         * SECURITY CHECK:
         * The logged-in client must own
         * this application.
         */

        if (
            application.customerId !==
            user.uid
        ) {

            showError(
                "You are not authorized to view this loan agreement."
            );

            return;

        }


        currentApplication = {

            id:
                applicationSnapshot.id,

            ...application

        };


        renderAgreement(
            currentApplication
        );

    }

    catch (error) {

        console.error(
            "Agreement loading error:",
            error
        );


        showError(
            "Unable to load the loan agreement. Please try again."
        );

    }

}


/*
|--------------------------------------------------------------------------
| RENDER AGREEMENT
|--------------------------------------------------------------------------
*/

function renderAgreement(
    application
) {


    const isRenewal =
        application.loanType ===
        "renewal";


    const loanType =
        isRenewal

            ?

            "LOAN RENEWAL AGREEMENT"

            :

            "FIRST LOAN AGREEMENT";


    const requestedAmount =
        Number(
            application.requestedAmount ||
            0
        );


    const interest =
        Number(
            application.interestAmount ||
            0
        );


    const maturity =
        Number(
            application.totalMaturityAmount ||
            requestedAmount +
            interest
        );


    const applicableFee =
        Number(
            application.processingOrRenewalFee ||
            0
        );


    const lateFee =
        Number(
            application.lateFeePerDay ||
            100
        );


    const feeLabel =
        isRenewal

            ?

            "Renewal Fee"

            :

            "First Loan Processing Fee";


    const borrowingDate =
        getApplicationDate(
            application.createdAt
        );


    const dueDate =
        calculateNextMonthDate(
            borrowingDate
        );


    agreementContainer.innerHTML =
        `


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="agreement-header">


            <h1>
                JITUME LEO
            </h1>


            <h2>
                ${loanType}
            </h2>


            <p>
                Emergency Loan Agreement
            </p>


            <p>

                Application ID:

                <strong>
                    ${escapeHTML(
                        application.id
                    )}
                </strong>

            </p>

        </div>



        <!-- =====================================
             CLIENT INFORMATION
        ====================================== -->

        <div class="agreement-section">

            <h3>
                1. Client & Agent Information
            </h3>


            <table class="details-table">


                <tr>

                    <td>
                        Client User ID
                    </td>

                    <td>
                        ${escapeHTML(
                            application.customerId ||
                            "-"
                        )}
                    </td>

                </tr>


                <tr>

                    <td>
                        Loan Type
                    </td>

                    <td>

                        ${escapeHTML(
                            isRenewal
                                ? "Loan Renewal"
                                : "First Loan"
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Selected Agent
                    </td>

                    <td>

                        ${escapeHTML(
                            application.agentName ||
                            "-"
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Agent ID
                    </td>

                    <td>

                        ${escapeHTML(
                            application.agentId ||
                            "-"
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Application Date
                    </td>

                    <td>

                        ${escapeHTML(
                            formatDate(
                                borrowingDate
                            )
                        )}

                    </td>

                </tr>

            </table>

        </div>



        <!-- =====================================
             LOAN DETAILS
        ====================================== -->

        <div class="agreement-section">

            <h3>
                2. Loan Details
            </h3>


            <table class="details-table">


                <tr>

                    <td>
                        Principal Amount
                    </td>

                    <td>

                        ${formatCurrency(
                            requestedAmount
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Interest
                    </td>

                    <td>

                        ${formatCurrency(
                            interest
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Amount Due at Maturity
                    </td>

                    <td>

                        <strong>

                            ${formatCurrency(
                                maturity
                            )}

                        </strong>

                    </td>

                </tr>


                <tr>

                    <td>
                        ${feeLabel}
                    </td>

                    <td>

                        ${formatCurrency(
                            applicableFee
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Borrowing Date
                    </td>

                    <td>

                        ${formatDate(
                            borrowingDate
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Expected Repayment Date
                    </td>

                    <td>

                        <strong>

                            ${formatDate(
                                dueDate
                            )}

                        </strong>

                    </td>

                </tr>


                <tr>

                    <td>
                        Late Repayment Charge
                    </td>

                    <td>

                        ${formatCurrency(
                            lateFee
                        )}
                        per late day

                    </td>

                </tr>

            </table>

        </div>



        <!-- =====================================
             TERMS
        ====================================== -->

        <div class="agreement-section">

            <h3>
                3. Terms & Conditions
            </h3>


            <ol class="terms-list">


                <li>

                    The principal loan amount is

                    <strong>
                        ${formatCurrency(
                            requestedAmount
                        )}
                    </strong>.

                </li>


                <li>

                    The agreed prototype loan interest is

                    <strong>
                        ${formatCurrency(
                            interest
                        )}
                    </strong>.

                </li>


                <li>

                    The normal amount due at maturity is

                    <strong>
                        ${formatCurrency(
                            maturity
                        )}
                    </strong>.

                </li>


                <li>

                    This application is classified as a

                    <strong>

                        ${isRenewal
                            ? "loan renewal"
                            : "first loan"}

                    </strong>.

                </li>


                <li>

                    The applicable

                    <strong>
                        ${feeLabel}
                    </strong>

                    is

                    <strong>
                        ${formatCurrency(
                            applicableFee
                        )}
                    </strong>.

                </li>


                <li>

                    Where the client cannot fully repay
                    the normal maturity amount and a
                    renewal is approved, the prototype
                    renewal terms provide for the applicable
                    interest and a KSh 500 renewal fee,
                    with the outstanding principal carried
                    forward according to the final agreement.

                </li>


                <li>

                    Late repayment carries a prototype
                    charge of

                    <strong>
                        ${formatCurrency(
                            lateFee
                        )}
                        per day
                    </strong>

                    added to the applicable interest,
                    subject to the final agreement.

                </li>


                <li>

                    The expected repayment date is the
                    same calendar date in the following
                    month, subject to the final agreement.

                </li>


                <li>

                    The client must provide truthful,
                    complete and accurate information.

                </li>


                <li>

                    The client must provide the required
                    supporting documents.

                </li>


                <li>

                    The guarantor must review and sign the
                    agreement before submission.

                </li>


                <li>

                    The selected agent must review and sign
                    the agreement before the client uploads
                    the completed document.

                </li>


                <li>

                    Agent verification is required before
                    the application is sent to administration.

                </li>


                <li>

                    Final approval or rejection is made by
                    Jitume Leo administration.

                </li>


                <li>

                    Payment and cash-collection stages occur
                    only after the appropriate approval stage
                    has been completed.

                </li>

            </ol>

        </div>



        <!-- =====================================
             SIGNATURES
        ====================================== -->

        <div class="agreement-section">

            <h3>
                4. Required Signatures
            </h3>


            <p>

                This agreement must be printed or otherwise
                completed and signed by all three parties
                before the client uploads it.

            </p>


            <div class="signature-grid">


                <!-- CLIENT -->

                <div class="signature-box">

                    <h4>
                        Client
                    </h4>


                    <div class="signature-line">
                    </div>


                    <p>
                        Signature
                    </p>


                    <p>
                        Name:
                        __________________
                    </p>


                    <p>
                        Date:
                        __________________
                    </p>

                </div>



                <!-- GUARANTOR -->

                <div class="signature-box">

                    <h4>
                        Guarantor
                    </h4>


                    <div class="signature-line">
                    </div>


                    <p>
                        Signature
                    </p>


                    <p>
                        Name:
                        __________________
                    </p>


                    <p>
                        Date:
                        __________________
                    </p>

                </div>



                <!-- AGENT -->

                <div class="signature-box">

                    <h4>
                        Agent
                    </h4>


                    <div class="signature-line">
                    </div>


                    <p>
                        Signature
                    </p>


                    <p>
                        Name:
                        ${escapeHTML(
                            application.agentName ||
                            ""
                        )}
                    </p>


                    <p>
                        Date:
                        __________________
                    </p>

                </div>


            </div>

        </div>



        <!-- =====================================
             NEXT STEP
        ====================================== -->

        <div class="next-step-box">

            <h3>
                Agreement Completed?
            </h3>


            <p>

                Download or print this agreement,
                obtain the required Client, Guarantor
                and Agent signatures, and keep the
                signed copy ready for the next stage.

            </p>


            <button
                type="button"
                class="continue-upload-btn"
                id="continueUploadButton">

                Continue to Upload Documents →

            </button>

        </div>



        <!-- =====================================
             PROTOTYPE NOTICE
        ====================================== -->

        <div class="prototype-note">

            <strong>
                Prototype Notice:
            </strong>


            This Jitume Leo agreement is part of a
            demonstration system. The stated loan
            terms, fees, late charges, guarantor
            obligations and agent responsibilities
            should be legally and commercially reviewed
            before real-world use.

        </div>

        `;

}


/*
|--------------------------------------------------------------------------
| CONTINUE TO UPLOAD
|--------------------------------------------------------------------------
*/

document
    .getElementById(
        "continueUploadButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !applicationId
            ) {

                alert(
                    "Application ID is missing."
                );

                return;

            }


            window.location.href =
                "upload-documents.html?applicationId="
                +
                encodeURIComponent(
                    applicationId
                );

        }
    );


/*
|--------------------------------------------------------------------------
| DOWNLOAD / PRINT
|--------------------------------------------------------------------------
*/

downloadButton.addEventListener(
    "click",
    () => {

        window.print();

    }
);


/*
|--------------------------------------------------------------------------
| BACK
|--------------------------------------------------------------------------
*/

backButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "client.html";

    }
);


/*
|--------------------------------------------------------------------------
| HELPERS
|--------------------------------------------------------------------------
*/

function formatCurrency(
    value
) {

    return "KSh " +

        Number(
            value || 0
        ).toLocaleString(
            "en-KE"
        );

}


function getApplicationDate(
    timestamp
) {

    if (!timestamp) {

        return new Date();

    }


    try {

        if (
            typeof timestamp.toDate ===
            "function"
        ) {

            return timestamp.toDate();

        }


        if (
            timestamp.seconds
        ) {

            return new Date(
                timestamp.seconds *
                1000
            );

        }


        if (
            typeof timestamp.toMillis ===
            "function"
        ) {

            return new Date(
                timestamp.toMillis()
            );

        }


        return new Date(
            timestamp
        );

    }

    catch (
        error
    ) {

        return new Date();

    }

}


function calculateNextMonthDate(
    borrowingDate
) {

    const date =
        new Date(
            borrowingDate
        );


    const originalDay =
        date.getDate();


    date.setMonth(
        date.getMonth() + 1
    );


    /*
     * Handle months that do not contain
     * the original day.
     */

    if (
        date.getDate() !==
        originalDay
    ) {

        date.setDate(0);

    }


    return date;

}


function formatDate(
    date
) {

    if (!date) {

        return "-";

    }


    try {

        return new Date(
            date
        ).toLocaleDateString(
            "en-KE",
            {

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"

            }
        );

    }

    catch (
        error
    ) {

        return "-";

    }

}


function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ?? ""
        );


    return div.innerHTML;

}


function showError(
    message
) {

    agreementContainer.innerHTML =
        `

        <div class="error-state">

            <h2>
                Unable to Open Agreement
            </h2>

            <p>

                ${escapeHTML(
                    message
                )}

            </p>

        </div>

        `;

}

</script>

</body>

</html>

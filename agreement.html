<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Loan Agreement | Jitume Leo</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .agreement-page {

            min-height:
                calc(100vh - 78px);

            background:
                #f5f7fa;

            padding:
                40px 20px;

        }


        .agreement-wrapper {

            max-width:
                950px;

            margin:
                auto;

        }


        .agreement-actions-top {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

            margin-bottom:
                25px;

        }


        .agreement-actions-top button {

            border:
                none;

            padding:
                12px 18px;

            border-radius:
                7px;

            cursor:
                pointer;

            font-weight:
                700;

        }


        .back-btn {

            background:
                #ffffff;

            border:
                1px solid #d8dee6 !important;

            color:
                #273142;

        }


        .download-btn {

            background:
                #168a63;

            color:
                #ffffff;

        }


        .agreement-paper {

            background:
                #ffffff;

            padding:
                55px;

            border-radius:
                8px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.08);

        }


        .agreement-header {

            text-align:
                center;

            border-bottom:
                2px solid #168a63;

            padding-bottom:
                25px;

            margin-bottom:
                30px;

        }


        .agreement-header h1 {

            font-size:
                30px;

            margin-bottom:
                7px;

        }


        .agreement-header h2 {

            font-size:
                18px;

            color:
                #168a63;

            margin-bottom:
                10px;

        }


        .agreement-header p {

            color:
                #697586;

            font-size:
                13px;

        }


        .agreement-section {

            margin-top:
                28px;

        }


        .agreement-section h3 {

            font-size:
                17px;

            margin-bottom:
                12px;

            color:
                #1f2937;

        }


        .details-table {

            width:
                100%;

            border-collapse:
                collapse;

        }


        .details-table td {

            border:
                1px solid #e2e7ec;

            padding:
                12px;

            font-size:
                13px;

        }


        .details-table td:first-child {

            width:
                40%;

            font-weight:
                700;

            background:
                #f8fafc;

        }


        .terms-list {

            padding-left:
                20px;

        }


        .terms-list li {

            margin-bottom:
                10px;

            line-height:
                1.7;

            font-size:
                13px;

            color:
                #4b5563;

        }


        .signature-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                25px;

            margin-top:
                30px;

        }


        .signature-box {

            border:
                1px solid #dfe4ea;

            min-height:
                145px;

            padding:
                15px;

            border-radius:
                6px;

        }


        .signature-box h4 {

            margin-bottom:
                45px;

        }


        .signature-line {

            border-top:
                1px solid #475467;

            margin-bottom:
                8px;

        }


        .signature-box p {

            margin:
                4px 0;

            font-size:
                12px;

            color:
                #667085;

        }


        .prototype-note {

            margin-top:
                30px;

            padding:
                15px;

            border-radius:
                7px;

            background:
                #fff8e5;

            border:
                1px solid #efdca0;

            font-size:
                12px;

            line-height:
                1.6;

            color:
                #6b5b1b;

        }


        .handover-box {

            margin-top:
                30px;

            padding:
                24px;

            border-radius:
                12px;

            background:
                #eef8f3;

            border:
                1px solid #cdebdc;

        }


        .handover-box h3 {

            margin-top:
                0;

            margin-bottom:
                10px;

        }


        .handover-box p {

            color:
                #596575;

            font-size:
                13px;

            line-height:
                1.7;

        }


        .handover-list {

            margin:
                15px 0 20px 20px;

        }


        .handover-list li {

            margin-bottom:
                8px;

            font-size:
                13px;

            line-height:
                1.6;

        }


        .fee-box {

            margin-top:
                18px;

            padding:
                17px;

            border-radius:
                9px;

            background:
                #fff8e7;

            border:
                1px solid #f0dfac;

        }


        .fee-box strong {

            font-size:
                18px;

        }


        .handover-status {

            margin-top:
                18px;

            padding:
                14px;

            border-radius:
                8px;

            font-size:
                13px;

        }


        .handover-status.pending {

            background:
                #f3f5f7;

            color:
                #596575;

        }


        .handover-status.reported {

            background:
                #fff8e7;

            color:
                #795900;

        }


        .handover-status.received {

            background:
                #e8f7ef;

            color:
                #168a63;

        }


        .handover-button {

            width:
                100%;

            border:
                none;

            background:
                #168a63;

            color:
                #ffffff;

            padding:
                14px 20px;

            border-radius:
                8px;

            font-weight:
                700;

            cursor:
                pointer;

            margin-top:
                20px;

        }


        .handover-button:hover {

            background:
                #106c4d;

        }


        .handover-button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        .success-message {

            display:
                none;

            margin-top:
                15px;

            background:
                #e8f7ef;

            color:
                #168a63;

            border:
                1px solid #cdebdc;

            border-radius:
                8px;

            padding:
                14px;

            font-size:
                13px;

        }


        .error-message {

            display:
                none;

            margin-top:
                15px;

            background:
                #fff0f0;

            color:
                #a61b1b;

            border:
                1px solid #f1c0c0;

            border-radius:
                8px;

            padding:
                14px;

            font-size:
                13px;

        }


        .loading {

            text-align:
                center;

            padding:
                60px;

            color:
                #667085;

        }


        .error-state {

            text-align:
                center;

            padding:
                60px 30px;

            color:
                #a61b1b;

        }


        @media print {

            .navbar,
            .agreement-actions-top,
            .handover-box,
            .prototype-note {

                display:
                    none !important;

            }


            .agreement-page {

                background:
                    #ffffff;

                padding:
                    0;

            }


            .agreement-wrapper {

                max-width:
                    none;

            }


            .agreement-paper {

                box-shadow:
                    none;

                padding:
                    20px;

            }

        }


        @media (max-width: 700px) {

            .agreement-paper {

                padding:
                    25px;

            }


            .signature-grid {

                grid-template-columns:
                    1fr;

            }


            .agreement-actions-top {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="logo">

        JITUME <span>LEO</span>

    </div>


    <nav>

        <a href="client.html">
            Dashboard
        </a>

    </nav>

</header>



<main class="agreement-page">

    <div class="agreement-wrapper">


        <div class="agreement-actions-top">


            <button
                type="button"
                class="back-btn"
                id="backButton">

                ← Back to Dashboard

            </button>


            <button
                type="button"
                class="download-btn"
                id="downloadButton">

                Download / Print Agreement

            </button>

        </div>



        <div
            id="agreementContainer"
            class="agreement-paper">

            <div class="loading">

                Loading loan agreement...

            </div>

        </div>

    </div>

</main>



<script type="module">

import {

    getAuth,

    onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {

    getFirestore,

    doc,

    getDoc,

    updateDoc,

    serverTimestamp

}

from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {

    app

}

from
"./firebase.js";


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const agreementContainer =
    document.getElementById(
        "agreementContainer"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const applicationId =
    urlParams.get(
        "applicationId"
    );


let currentApplication = null;


/*
|--------------------------------------------------------------------------
| AUTHENTICATION
|--------------------------------------------------------------------------
*/

onAuthStateChanged(
    auth,
    async (user) => {


        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        if (!applicationId) {

            showError(
                "Application ID is missing. Please return to your client dashboard and open your application again."
            );

            return;

        }


        await loadApplication(
            user
        );

    }
);


/*
|--------------------------------------------------------------------------
| LOAD EXACT APPLICATION
|--------------------------------------------------------------------------
*/

async function loadApplication(
    user
) {

    try {


        const applicationReference =
            doc(
                db,
                "loanApplications",
                applicationId
            );


        const applicationSnapshot =
            await getDoc(
                applicationReference
            );


        if (
            !applicationSnapshot.exists()
        ) {

            showError(
                "The requested loan application could not be found."
            );

            return;

        }


        const application =
            applicationSnapshot.data();


        /*
         * SECURITY CHECK:
         * This client must own the application.
         */

        if (
            application.customerId !==
            user.uid
        ) {

            showError(
                "You are not authorized to view this loan agreement."
            );

            return;

        }


        currentApplication = {

            id:
                applicationSnapshot.id,

            ...application

        };


        renderAgreement(
            currentApplication
        );

    }

    catch (error) {

        console.error(
            "Agreement loading error:",
            error
        );


        showError(
            "Unable to load the loan agreement. Please try again."
        );

    }

}


/*
|--------------------------------------------------------------------------
| RENDER AGREEMENT
|--------------------------------------------------------------------------
*/

function renderAgreement(
    application
) {


    const isRenewal =
        application.loanType ===
        "renewal";


    const loanType =
        isRenewal

            ?

            "LOAN RENEWAL AGREEMENT"

            :

            "FIRST LOAN AGREEMENT";


    const requestedAmount =
        Number(
            application.requestedAmount ||
            0
        );


    const interest =
        Number(
            application.interestAmount ||
            0
        );


    const maturity =
        Number(
            application.totalMaturityAmount ||
            requestedAmount +
            interest
        );


    const applicableFee =
        Number(
            application.processingOrRenewalFee ||
            0
        );


    const lateFee =
        Number(
            application.lateFeePerDay ||
            100
        );


    const feeLabel =
        isRenewal

            ?

            "Renewal Fee"

            :

            "First Loan Processing Fee";


    const borrowingDate =
        getApplicationDate(
            application.createdAt
        );


    const dueDate =
        calculateNextMonthDate(
            borrowingDate
        );


    const documentsStatus =
        application.documentsStatus ||
        "NOT_HANDED_TO_AGENT";


    const feeStatus =
        application.feeStatus ||
        "FEE_PENDING";


    const clientReportStatus =
        application.clientHandoverStatus ||
        "NOT_REPORTED";


    let handoverMessage =

        "Print the agreement, obtain all required signatures, prepare the required identification documents and take the hard copies to your selected agent.";


    let handoverClass =
        "pending";


    if (
        clientReportStatus ===
        "CLIENT_HANDOVER_REPORTED"
    ) {

        handoverMessage =
            "You have reported that you handed the signed documents and applicable fee to the agent. The agent must now confirm actual receipt.";

        handoverClass =
            "reported";

    }


    if (
        documentsStatus ===
        "DOCUMENTS_RECEIVED" &&
        feeStatus ===
        "FEE_RECEIVED"
    ) {

        handoverMessage =
            "Your agent has confirmed receipt of the required physical documents and the applicable KSh 500 fee.";

        handoverClass =
            "received";

    }


    agreementContainer.innerHTML =
        `


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="agreement-header">


            <h1>
                JITUME LEO
            </h1>


            <h2>
                ${loanType}
            </h2>


            <p>
                Emergency Loan Agreement
            </p>


            <p>

                Application ID:

                <strong>

                    ${escapeHTML(
                        application.id
                    )}

                </strong>

            </p>

        </div>



        <!-- =====================================
             CLIENT & AGENT
        ====================================== -->

        <div class="agreement-section">

            <h3>
                1. Client & Agent Information
            </h3>


            <table class="details-table">


                <tr>

                    <td>
                        Client User ID
                    </td>

                    <td>

                        ${escapeHTML(
                            application.customerId ||
                            "-"
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Loan Type
                    </td>

                    <td>

                        ${escapeHTML(
                            isRenewal
                                ? "Loan Renewal"
                                : "First Loan"
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Selected Agent
                    </td>

                    <td>

                        ${escapeHTML(
                            application.agentName ||
                            "-"
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Agent ID
                    </td>

                    <td>

                        ${escapeHTML(
                            application.agentId ||
                            "-"
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Application Date
                    </td>

                    <td>

                        ${escapeHTML(
                            formatDate(
                                borrowingDate
                            )
                        )}

                    </td>

                </tr>

            </table>

        </div>



        <!-- =====================================
             LOAN DETAILS
        ====================================== -->

        <div class="agreement-section">

            <h3>
                2. Loan Details
            </h3>


            <table class="details-table">


                <tr>

                    <td>
                        Principal Amount
                    </td>

                    <td>

                        ${formatCurrency(
                            requestedAmount
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Interest
                    </td>

                    <td>

                        ${formatCurrency(
                            interest
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Amount Due at Maturity
                    </td>

                    <td>

                        <strong>

                            ${formatCurrency(
                                maturity
                            )}

                        </strong>

                    </td>

                </tr>


                <tr>

                    <td>
                        ${feeLabel}
                    </td>

                    <td>

                        <strong>

                            ${formatCurrency(
                                applicableFee
                            )}

                        </strong>

                    </td>

                </tr>


                <tr>

                    <td>
                        Borrowing Date
                    </td>

                    <td>

                        ${formatDate(
                            borrowingDate
                        )}

                    </td>

                </tr>


                <tr>

                    <td>
                        Expected Repayment Date
                    </td>

                    <td>

                        <strong>

                            ${formatDate(
                                dueDate
                            )}

                        </strong>

                    </td>

                </tr>


                <tr>

                    <td>
                        Late Repayment Charge
                    </td>

                    <td>

                        ${formatCurrency(
                            lateFee
                        )}
                        per late day

                    </td>

                </tr>

            </table>

        </div>



        <!-- =====================================
             TERMS
        ====================================== -->

        <div class="agreement-section">

            <h3>
                3. Terms & Conditions
            </h3>


            <ol class="terms-list">


                <li>

                    The principal loan amount is

                    <strong>

                        ${formatCurrency(
                            requestedAmount
                        )}

                    </strong>.

                </li>


                <li>

                    The prototype loan interest is

                    <strong>

                        ${formatCurrency(
                            interest
                        )}

                    </strong>.

                </li>


                <li>

                    The normal maturity amount is

                    <strong>

                        ${formatCurrency(
                            maturity
                        )}

                    </strong>.

                </li>


                <li>

                    This application is classified as a

                    <strong>

                        ${isRenewal
                            ? "loan renewal"
                            : "first loan"}

                    </strong>.

                </li>


                <li>

                    The applicable

                    <strong>

                        ${feeLabel}

                    </strong>

                    is

                    <strong>

                        ${formatCurrency(
                            applicableFee
                        )}

                    </strong>.

                </li>


                <li>

                    For a renewal, the prototype terms
                    provide for the applicable interest
                    and a KSh 500 renewal fee, with the
                    outstanding principal carried forward
                    according to the final agreement.

                </li>


                <li>

                    A late repayment charge of

                    <strong>

                        ${formatCurrency(
                            lateFee
                        )}
                        per day

                    </strong>

                    is added under the prototype
                    business rules.

                </li>


                <li>

                    The expected repayment date is the
                    same calendar date in the following
                    month, subject to the final agreement.

                </li>


                <li>

                    The client must provide truthful,
                    complete and accurate information.

                </li>


                <li>

                    The client must provide the required
                    identification documents.

                </li>


                <li>

                    The guarantor must review and sign
                    the agreement.

                </li>


                <li>

                    The selected agent must review and
                    sign the agreement.

                </li>


                <li>

                    The signed original agreement and
                    required identification documents
                    must be handed physically to the
                    selected agent.

                </li>


                <li>

                    The applicable KSh 500 first-loan
                    processing fee or KSh 500 renewal fee
                    is to be handed to the selected agent
                    at the physical document handover
                    stage.

                </li>


                <li>

                    The client must not regard the
                    documents or fee as officially received
                    until the selected agent confirms
                    receipt through the Jitume Leo system.

                </li>


                <li>

                    Agent verification is required before
                    the application proceeds to
                    administration.

                </li>


                <li>

                    Final approval or rejection is made
                    by Jitume Leo administration.

                </li>

            </ol>

        </div>



        <!-- =====================================
             SIGNATURES
        ====================================== -->

        <div class="agreement-section">

            <h3>
                4. Required Signatures
            </h3>


            <p>

                The following three parties must sign
                the printed agreement before it is
                handed to the agent:

            </p>


            <div class="signature-grid">


                <!-- CLIENT -->

                <div class="signature-box">

                    <h4>
                        Client
                    </h4>


                    <div class="signature-line">
                    </div>


                    <p>
                        Signature
                    </p>


                    <p>
                        Name:
                        __________________
                    </p>


                    <p>
                        Date:
                        __________________
                    </p>

                </div>



                <!-- GUARANTOR -->

                <div class="signature-box">

                    <h4>
                        Guarantor
                    </h4>


                    <div class="signature-line">
                    </div>


                    <p>
                        Signature
                    </p>


                    <p>
                        Name:
                        __________________
                    </p>


                    <p>
                        Date:
                        __________________
                    </p>

                </div>



                <!-- AGENT -->

                <div class="signature-box">

                    <h4>
                        Agent
                    </h4>


                    <div class="signature-line">
                    </div>


                    <p>
                        Signature
                    </p>


                    <p>

                        Name:

                        ${escapeHTML(
                            application.agentName ||
                            ""
                        )}

                    </p>


                    <p>
                        Date:
                        __________________
                    </p>

                </div>

            </div>

        </div>



        <!-- =====================================
             PHYSICAL HANDOVER
        ====================================== -->

        <div class="handover-box">


            <h3>
                5. Physical Document & Fee Handover
            </h3>


            <p>

                After printing and completing the
                agreement, take the signed physical
                documents to your selected Jitume Leo
                agent.

            </p>


            <ul class="handover-list">

                <li>
                    Signed original Jitume Leo agreement
                </li>

                <li>
                    Client ID and required copy
                </li>

                <li>
                    Guarantor ID and required copy
                </li>

                <li>
                    Any other documents requested by
                    the selected agent
                </li>

                <li>
                    Applicable KSh 500 fee
                </li>

            </ul>


            <div class="fee-box">

                <div>
                    Applicable Fee:
                </div>


                <strong>

                    KSh
                    ${Number(
                        applicableFee
                    ).toLocaleString(
                        "en-KE"
                    )}

                </strong>


                <div style="margin-top:6px;">

                    ${
                        isRenewal
                            ? "Renewal Fee"
                            : "First Loan Processing Fee"
                    }

                </div>

            </div>


            <div class="handover-status ${handoverClass}">

                <strong>
                    Current Handover Status:
                </strong>

                <br><br>

                ${escapeHTML(
                    handoverMessage
                )}

            </div>


            <div
                id="handoverSuccess"
                class="success-message">

            </div>


            <div
                id="handoverError"
                class="error-message">

            </div>


            ${
                (
                    clientReportStatus ===
                    "CLIENT_HANDOVER_REPORTED"
                )

                ||

                (
                    documentsStatus ===
                    "DOCUMENTS_RECEIVED"
                )

                ||

                (
                    feeStatus ===
                    "FEE_RECEIVED"
                )

                    ?

                    ""

                    :

                    `

                    <button
                        type="button"
                        class="handover-button"
                        id="reportHandoverButton">

                        I Have Handed the Documents
                        & Paid the KSh 500 Fee

                    </button>

                    `
            }


            ${
                clientReportStatus ===
                "CLIENT_HANDOVER_REPORTED"

                    ?

                    `
                    <p style="
                        margin-top:14px;
                        font-size:12px;
                        color:#795900;
                    ">

                        Awaiting the selected agent's
                        confirmation of physical document
                        and fee receipt.

                    </p>
                    `

                    :

                    ""
            }


            ${
                documentsStatus ===
                    "DOCUMENTS_RECEIVED" &&
                feeStatus ===
                    "FEE_RECEIVED"

                    ?

                    `
                    <p style="
                        margin-top:14px;
                        font-size:13px;
                        color:#168a63;
                        font-weight:700;
                    ">

                        ✓ Agent has confirmed the
                        documents and KSh 500 fee.

                    </p>
                    `

                    :

                    ""
            }

        </div>



        <!-- =====================================
             PROTOTYPE NOTICE
        ====================================== -->

        <div class="prototype-note">

            <strong>
                Prototype Notice:
            </strong>


            This Jitume Leo agreement is part of a
            demonstration system. The stated loan terms,
            fees, late charges, guarantor obligations,
            agent responsibilities and handover process
            should be legally and commercially reviewed
            before real-world use.

        </div>


        `;

    
    /*
    |--------------------------------------------------------------------------
    | HANDOVER BUTTON
    |--------------------------------------------------------------------------
    */

    const reportButton =
        document.getElementById(
            "reportHandoverButton"
        );


    if (reportButton) {

        reportButton.addEventListener(
            "click",
            reportClientHandover
        );

    }

}


/*
|--------------------------------------------------------------------------
| CLIENT REPORTS HANDOVER
|--------------------------------------------------------------------------
*/

async function reportClientHandover() {

    if (
        !currentApplication
    ) {

        return;

    }


    const button =
        document.getElementById(
            "reportHandoverButton"
        );


    const successBox =
        document.getElementById(
            "handoverSuccess"
        );


    const errorBox =
        document.getElementById(
            "handoverError"
        );


    if (
        !button
    ) {

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "Recording...";


    successBox.style.display =
        "none";


    errorBox.style.display =
        "none";


    try {

        const applicationReference =
            doc(
                db,
                "loanApplications",
                currentApplication.id
            );


        await updateDoc(
            applicationReference,
            {

                clientHandoverStatus:
                    "CLIENT_HANDOVER_REPORTED",

                documentsStatus:
                    "DOCUMENTS_AWAITING_RECEIPT",

                feeStatus:
                    "FEE_AWAITING_AGENT_CONFIRMATION",

                status:
                    "AWAITING_AGENT_VERIFICATION",

                clientHandoverReportedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }
        );


        successBox.textContent =
            "Your handover report has been recorded. The selected agent must now confirm receipt of the physical documents and KSh 500 fee.";


        successBox.style.display =
            "block";


        setTimeout(
            () => {

                window.location.reload();

            },
            1500
        );

    }

    catch (error) {

        console.error(
            "Handover update error:",
            error
        );


        errorBox.textContent =
            "Unable to record the handover. Please try again.";


        errorBox.style.display =
            "block";


        button.disabled =
            false;


        button.textContent =
            "I Have Handed the Documents & Paid the KSh 500 Fee";

    }

}

function formatCurrency(
    value
) {

    return "KSh " +

        Number(
            value || 0
        ).toLocaleString(
            "en-KE"
        );

}


function getApplicationDate(
    timestamp
) {

    if (!timestamp) {

        return new Date();

    }


    try {

        if (
            typeof timestamp.toDate ===
            "function"
        ) {

            return timestamp.toDate();

        }


        if (
            timestamp.seconds
        ) {

            return new Date(
                timestamp.seconds *
                1000
            );

        }


        if (
            typeof timestamp.toMillis ===
            "function"
        ) {

            return new Date(
                timestamp.toMillis()
            );

        }


        return new Date(
            timestamp
        );

    }

    catch (
        error
    ) {

        return new Date();

    }

}


function calculateNextMonthDate(
    borrowingDate
) {

    const date =
        new Date(
            borrowingDate
        );


    const originalDay =
        date.getDate();


    date.setMonth(
        date.getMonth() + 1
    );


    /*
     * Handle months that don't contain
     * the original day.
     */

    if (
        date.getDate() !==
        originalDay
    ) {

        date.setDate(
            0
        );

    }


    return date;

}


function formatDate(
    date
) {

    if (!date) {

        return "-";

    }


    try {

        return new Date(
            date
        ).toLocaleDateString(
            "en-KE",
            {

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"

            }
        );

    }

    catch (
        error
    ) {

        return "-";

    }

}


function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value ?? ""
        );


    return div.innerHTML;

}


function showError(
    message
) {

    agreementContainer.innerHTML =
        `

        <div class="error-state">

            <h2>
                Unable to Open Agreement
            </h2>


            <p>

                ${escapeHTML(
                    message
                )}

            </p>

        </div>

        `;

}
